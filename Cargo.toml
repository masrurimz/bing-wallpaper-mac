[package]
name = "bing-wallpaper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bing_wallpaper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
md-5 = "0.10"
rand = "0.8"
rdev = "0.5"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
users = "0.11"
wallpaper = "3"
rust-ini = "0.21"
inquire = "0.9.4"
