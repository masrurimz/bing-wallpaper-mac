[package]
name = "bing-wallpaper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bing_wallpaper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
md-5 = "0.10"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
